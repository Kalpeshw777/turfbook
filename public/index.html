<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TurfBook — Sports Turf Booking</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #090d16;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo-container {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.35);
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    h1 span {
      color: #10b981;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 14px;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 24px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
    }
    .card {
      background: #131c2e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
      text-align: left;
    }
    .card label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="url"] {
      flex: 1;
      background: #0b1120;
      border: 1px solid #334155;
      color: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus {
      border-color: #10b981;
    }
    .btn {
      background: #10b981;
      color: #042f2e;
      border: none;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #34d399;
    }
    .btn-secondary {
      background: #1e293b;
      color: #e2e8f0;
      margin-top: 10px;
    }
    .btn-secondary:hover {
      background: #334155;
    }
    .quick-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .quick-link-btn {
      background: #0f172a;
      border: 1px solid #1e293b;
      color: #94a3b8;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .quick-link-btn:hover {
      border-color: #10b981;
      color: #f1f5f9;
    }
    .quick-link-btn span.badge {
      background: #1e293b;
      color: #10b981;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
    }
    .info-box {
      font-size: 12px;
      color: #64748b;
      line-height: 1.5;
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo-container">⚽</div>
  <h1>Turf<span>Book</span></h1>
  <p class="subtitle">Book sports turfs, manage venues, and join tournaments.</p>

  <div class="status-badge" id="statusBadge">
    <div class="status-dot"></div>
    <span id="statusText">Server not reached</span>
  </div>

  <div class="card">
    <label for="serverUrlInput">Connect To Server</label>
    <div class="input-group">
      <input type="url" id="serverUrlInput" placeholder="https://..." value="">
    </div>
    <button class="btn" id="connectBtn" onclick="connectToServer()">Connect to TurfBook</button>

    <div class="quick-links">
      <button class="quick-link-btn" onclick="useQuickUrl('http://192.168.1.101:3000')">
        <span>🏠 Local PC (Same Wi-Fi)</span>
        <span class="badge">192.168.1.101:3000</span>
      </button>
    </div>
  </div>

  <div class="info-box">
    💡 Make sure your TurfBook server is running with <code>npm run dev</code> on your computer, or provide a deployed cloud/tunnel URL to share with friends.
  </div>

  <script>
    const DEFAULT_SERVER = 'http://192.168.1.101:3000';
    const storedUrl = localStorage.getItem('turfbook_server_url') || DEFAULT_SERVER;
    document.getElementById('serverUrlInput').value = storedUrl;

    function connectToServer() {
      const url = document.getElementById('serverUrlInput').value.trim();
      if (!url) return;
      localStorage.setItem('turfbook_server_url', url);
      document.getElementById('statusText').innerText = 'Connecting to ' + url + '...';
      document.getElementById('statusBadge').style.borderColor = 'rgba(16, 185, 129, 0.4)';
      document.getElementById('statusBadge').style.color = '#34d399';
      document.querySelector('.status-dot').style.background = '#10b981';
      window.location.href = url;
    }

    function useQuickUrl(url) {
      document.getElementById('serverUrlInput').value = url;
      connectToServer();
    }

    // Try auto-connecting if user previously navigated
    const autoRedirect = sessionStorage.getItem('turfbook_tried_auto');
    if (!autoRedirect && storedUrl && storedUrl !== 'http://10.0.2.2:3000') {
      sessionStorage.setItem('turfbook_tried_auto', '1');
      // Test fetch with short timeout before redirecting to avoid infinite loop
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 2000);
      fetch(storedUrl, { mode: 'no-cors', signal: controller.signal })
        .then(() => {
          clearTimeout(timeoutId);
          window.location.href = storedUrl;
        })
        .catch(() => {
          // Stay on this friendly screen if server is not reachable
          document.getElementById('statusText').innerText = 'Could not reach ' + storedUrl;
        });
    }
  </script>
</body>
</html>
